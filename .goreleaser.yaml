version: 2

project_name: motive

builds:
  - id: motive
    main: ./cmd/motive
    binary: motive
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/acidsound/Motive/internal/version.Version={{.Version}}

  - id: motive-darwin
    main: ./cmd/motive
    binary: motive
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/acidsound/Motive/internal/version.Version={{.Version}}

universal_binaries:
  - id: motive-universal
    ids:
      - motive-darwin
    replace: true
    name_template: "motive_{{ .Version }}_darwin_universal"

archives:
  - id: motive-platforms
    ids:
      - motive
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

  - id: motive-macos
    ids:
      - motive-darwin
      - motive-universal
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_darwin_universal"
    format_overrides:
      - goos: darwin
        formats:
          - tar.gz

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^merge:"
      - "^ci:"

release:
  mode: replace
  # Fixed semver tag (v0.0.0) => one rolling release, titled "Latest".
  name_template: "Latest"
