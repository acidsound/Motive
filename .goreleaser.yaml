version: 2

project_name: motive

builds:
  - id: motive
    main: ./cmd/motive
    binary: motive
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/acidsound/Motive/internal/version.Version={{.Version}}

  - id: motive-linux-arm64
    main: ./cmd/motive
    binary: motive
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/acidsound/Motive/internal/version.Version={{.Version}}

  - id: motive-darwin
    main: ./cmd/motive
    binary: motive
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/acidsound/Motive/internal/version.Version={{.Version}}

# Combine macOS amd64 + arm64 into one Universal Binary.
universal_binaries:
  - id: motive-universal
    ids:
      - motive-darwin
    replace: true
    name_template: "motive_{{ .Version }}_darwin_universal"

archives:
  - id: motive
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Os \"darwin\" }}universal{{ else }}{{ .Arch }}{{ end }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

# Keep GitHub Release notes concise instead of listing the full commit history.
changelog:
  disable: true

release:
  mode: replace
  name_template: "Latest"
  header: |
    ## Motive

    Latest build with cross-platform binaries:
    - Linux amd64 / arm64
    - macOS Universal (Intel + Apple Silicon)
    - Windows amd64
