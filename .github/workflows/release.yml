name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o motive ./cmd/motive

      - name: Package Linux amd64
        run: tar -czf "motive_${GITHUB_REF_NAME}_linux_amd64.tar.gz" motive

      - name: Build Linux arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o motive ./cmd/motive

      - name: Package Linux arm64
        run: tar -czf "motive_${GITHUB_REF_NAME}_linux_arm64.tar.gz" motive

      - name: Build Windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o motive.exe ./cmd/motive

      - name: Package Windows amd64
        run: zip "motive_${GITHUB_REF_NAME}_windows_amd64.zip" motive.exe

      - name: Build macOS amd64
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o motive-darwin-amd64 ./cmd/motive

      - name: Build macOS arm64
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o motive-darwin-arm64 ./cmd/motive

      - name: Create macOS Universal Binary
        run: |
          lipo -create motive-darwin-amd64 motive-darwin-arm64 -output motive

      - name: Package macOS Universal
        run: tar -czf "motive_${GITHUB_REF_NAME}_darwin_universal.tar.gz" motive

      - name: Generate checksums
        run: sha256 -a 256 motive_*.tar.gz motive_*.zip > checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            NOTES=$(cat RELEASE_NOTES.md)
          else
            NOTES="## Motive ${GITHUB_REF_NAME}\n\nCross-platform release for Windows x86-64, Linux x86-64, Linux ARM64 (Android/Termux), and macOS Universal (Intel + Apple Silicon)."
          fi
          gh release create "${GITHUB_REF_NAME}" \
            motive_${GITHUB_REF_NAME}_linux_amd64.tar.gz \
            motive_${GITHUB_REF_NAME}_linux_arm64.tar.gz \
            motive_${GITHUB_REF_NAME}_darwin_universal.tar.gz \
            motive_${GITHUB_REF_NAME}_windows_amd64.zip \
            checksums.txt \
            --title "Motive ${GITHUB_REF_NAME}" \
            --notes "${NOTES}" \
            --verify-tag
