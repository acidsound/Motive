name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Serialize release runs so two goreleaser invocations can never overlap on
# the same tag (which is what produced duplicate-named assets before).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      # Fixed tag => one rolling "Latest" release rebuilt on every push.
      # Must be valid semver for GoReleaser; the release is titled "Latest"
      # via .goreleaser.yaml (release.name).
      - name: Tag for release
        id: tag
        run: |
          TAG="v0.0.0"
          git tag -f "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Start from a clean slate: drop any prior release (and all its assets)
      # so goreleaser always creates a fresh one instead of stacking assets.
      - name: Delete existing release
        run: gh release delete "${{ steps.tag.outputs.tag }}" --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
